name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: jobs can only read the repo unless they say otherwise.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build
        run: pnpm build
      - name: App refuses to start with missing settings
        run: |
          if timeout 20 pnpm start -p 3100 > start.log 2>&1; then
            echo "Server started without required settings"; exit 1
          fi
          grep -q "Invalid environment configuration" start.log

  database:
    name: Database migrations and access tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway CI-only database, not a real secret.
          POSTGRES_PASSWORD: ci-only-not-secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgresql://postgres:ci-only-not-secret@localhost:5432/postgres
      TEST_ADMIN_DATABASE_URL: postgresql://postgres:ci-only-not-secret@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Schema matches migrations
        run: pnpm db:check-drift
      - name: Sample seed runs
        run: pnpm db:seed
      - name: Seed refuses production
        run: |
          if NODE_ENV=production pnpm db:seed; then echo "Seed ran in production mode"; exit 1; fi
      - name: Access tests (row-level security, roles, append-only audit)
        run: pnpm test:integration

  e2e:
    name: Browser tests (English and Arabic)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-not-secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgresql://postgres:ci-only-not-secret@localhost:5432/postgres
      DATABASE_URL: postgresql://advisr_app:ci-only-not-secret@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379
      AUTH_URL: https://localhost
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Database with sample data and a restricted app login
        run: |
          pnpm db:migrate
          pnpm db:seed
          psql "$MIGRATION_DATABASE_URL" -c "CREATE ROLE advisr_app LOGIN NOINHERIT PASSWORD 'ci-only-not-secret'; GRANT app_public, app_company, app_admin TO advisr_app;"
      - name: Throwaway secrets for this run only
        run: |
          echo "SESSION_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "FIELD_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  dependencies:
    name: Dependency scan (pnpm audit + osv-scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: pnpm audit (fails on high or critical)
        run: pnpm audit --audit-level=high
      - uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --lockfile=./pnpm-lock.yaml

  sast:
    name: Code scan (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install semgrep==1.187.0
      - name: Semgrep
        run: >
          semgrep scan --metrics=off --error
          --config p/javascript --config p/typescript --config p/react
          --config p/owasp-top-ten --config p/secrets
          --exclude prototype
